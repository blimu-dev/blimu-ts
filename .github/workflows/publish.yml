name: Publish to npm

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish @blimu/backend, @blimu/client, @blimu/nestjs, and @blimu/react
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for unversioned changesets
        id: check_changesets
        run: |
          # Check if there are any unversioned changeset files
          if [ -n "$(find .changeset -name '*.md' -type f 2>/dev/null | grep -v README)" ]; then
            echo "has_unversioned_changesets=true" >> $GITHUB_OUTPUT
            echo "Found unversioned changeset files - skipping publish (version PR should be created first)"
          else
            echo "has_unversioned_changesets=false" >> $GITHUB_OUTPUT
            echo "No unversioned changeset files found - ready to publish"
          fi

      - name: Get version from package.json
        id: get_version
        if: steps.check_changesets.outputs.has_unversioned_changesets == 'false'
        run: |
          # Read version from package.json (updated by changeset version)
          VERSION=$(node -e "const pkg = require('./packages/backend/package.json'); console.log(pkg.version);")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build packages
        if: steps.check_changesets.outputs.has_unversioned_changesets == 'false'
        run: yarn build

      - name: Publish to npm
        if: steps.check_changesets.outputs.has_unversioned_changesets == 'false'
        run: yarn changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create git tag
        if: steps.check_changesets.outputs.has_unversioned_changesets == 'false'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
