name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.4.5)'
        required: true

jobs:
  publish:
    name: Publish @blimu/backend and @blimu/nestjs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Verify package.json versions match tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Verifying package.json versions match tag v${VERSION}..."

          # Read versions from package.json files
          BACKEND_VERSION=$(node -e "const pkg = require('./packages/backend/package.json'); console.log(pkg.version);")
          NESTJS_VERSION=$(node -e "const pkg = require('./packages/nestjs/package.json'); console.log(pkg.version);")
          ROOT_VERSION=$(node -e "const pkg = require('./package.json'); console.log(pkg.version);")

          echo "Backend package.json version: ${BACKEND_VERSION}"
          echo "NestJS package.json version: ${NESTJS_VERSION}"
          echo "Root package.json version: ${ROOT_VERSION}"
          echo "Tag version: ${VERSION}"

          ERRORS=0

          if [ "${BACKEND_VERSION}" != "${VERSION}" ]; then
            echo "❌ Error: @blimu/backend package.json version (${BACKEND_VERSION}) does not match tag version (${VERSION})"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ @blimu/backend version matches"
          fi

          if [ "${NESTJS_VERSION}" != "${VERSION}" ]; then
            echo "❌ Error: @blimu/nestjs package.json version (${NESTJS_VERSION}) does not match tag version (${VERSION})"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ @blimu/nestjs version matches"
          fi

          if [ "${ROOT_VERSION}" != "${VERSION}" ]; then
            echo "⚠️  Warning: Root package.json version (${ROOT_VERSION}) does not match tag version (${VERSION})"
            echo "   (This is a warning only, root package.json is not published)"
          else
            echo "✅ Root package.json version matches"
          fi

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "Please update the package.json files to match the tag version before publishing."
            echo "You can update them manually or use a tool like 'npm version' or 'yarn version'."
            exit 1
          fi

          echo ""
          echo "✅ All package.json versions match the tag version"

      - name: Verify CLI release exists
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Checking if CLI release v${VERSION} exists..."

          # Check if CLI release exists via GitHub API
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/blimu-dev/blimu-cli/releases/tags/v${VERSION}")

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ CLI release v${VERSION} exists"
          elif [ "$RESPONSE" = "404" ]; then
            echo "❌ CLI release v${VERSION} not found"
            echo ""
            echo "Error: Cannot publish @blimu/backend@${VERSION} because CLI release v${VERSION} does not exist."
            echo ""
            echo "Please ensure you have:"
            echo "1. Created and pushed the CLI release tag: git tag v${VERSION} && git push origin v${VERSION}"
            echo "2. Waited for the CLI build workflow to complete and create the release"
            echo "3. Then retry publishing the npm packages"
            echo ""
            echo "This ensures version consistency between npm packages and CLI binaries."
            exit 1
          else
            echo "❌ Failed to check CLI release (HTTP ${RESPONSE})"
            echo "This might be a temporary GitHub API issue. Please retry."
            exit 1
          fi

      - name: Update package versions
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"

          # Update backend package.json version
          cd packages/backend
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '${VERSION}'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          cd ../..

          # Update nestjs package.json version and replace workspace dependency
          cd packages/nestjs
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json')); pkg.version = '${VERSION}'; if (pkg.dependencies && pkg.dependencies['@blimu/backend']) { pkg.dependencies['@blimu/backend'] = '${VERSION}'; } fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          cd ../..

      - name: Install dependencies
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Build @blimu/backend
        run: yarn workspace @blimu/backend build

      - name: Publish @blimu/backend
        working-directory: packages/backend
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation
        run: |
          echo "Waiting for @blimu/backend to be available on npm..."
          sleep 10
          # Try to fetch the package to ensure it's available
          for i in {1..30}; do
            if npm view @blimu/backend@${{ steps.get_version.outputs.version }} version > /dev/null 2>&1; then
              echo "Package is available on npm!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Build @blimu/nestjs
        run: yarn workspace @blimu/nestjs build

      - name: Publish @blimu/nestjs
        working-directory: packages/nestjs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
